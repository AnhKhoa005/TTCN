# removed obsolete `version` key (Compose v2 uses no top-level `version`)

# Common Django template for GeoNode and Celery services below
x-common-django:
  &default-common-django
  image: geonode/geonode:latest-ubuntu-24.04
  build:
      context: ./
      dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - .:/usr/src/geonode/
    - statics:/mnt/volumes/statics
    - geoserver-data-dir:/geoserver_data/data
    - backup-restore:/backup_restore
    - data:/data
    - tmp:/tmp
    # --- Custom MapStore template overrides (persist across container recreate) ---
    - ./templates/geonode-mapstore-client/index.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/index.html
    - ./templates/geonode-mapstore-client/pages/datasets.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/datasets.html
    - ./templates/geonode-mapstore-client/pages/maps.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/maps.html
    - ./templates/geonode-mapstore-client/pages/documents.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/documents.html
    - ./templates/geonode-mapstore-client/snippets/chatbox.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/snippets/chatbox.html
    - ./arsha:/mnt/volumes/statics/static/arsha
  depends_on:
    db:
      condition: service_healthy

services:

  # Our custom django application. It includes Geonode.
  django:
    << : *default-common-django
    container_name: django4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl -m 10 --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://django:8000/"
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 2
    environment:
      - IS_CELERY=False
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "uwsgi --ini /usr/src/geonode/uwsgi.ini"
    

  # Celery worker that executes celery tasks created by Django.
  celery:
    << : *default-common-django
    container_name: celery4${COMPOSE_PROJECT_NAME}
    depends_on:
      django:
        condition: service_healthy
    environment:
      - IS_CELERY=True
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "celery-cmd"

  # memcached service
  memcached:
    image: memcached:alpine
    container_name: memcached4${COMPOSE_PROJECT_NAME}
    command: memcached ${MEMCACHED_OPTIONS}
    restart: unless-stopped
    healthcheck:
      test: nc -z 127.0.0.1 11211
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # Nginx is serving django static and media files and proxies to django and geonode
  geonode:
    image: geonode/nginx:1.31.0-latest
    container_name: nginx4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    environment:
      - RESOLVER=127.0.0.11
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - nginx-confd:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - statics:/mnt/volumes/statics
      - ./arsha:/mnt/volumes/statics/static/arsha
    restart: unless-stopped

  # Gets and installs letsencrypt certificates
  letsencrypt:
    image: geonode/letsencrypt:2.6.0-latest
    container_name: letsencrypt4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    volumes:
      - nginx-certificates:/geonode-certificates
    restart: unless-stopped

  # Geoserver backend
  geoserver:
    image: geonode/geoserver:2.28.x-latest
    container_name: geoserver4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl -m 10 --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://geoserver:8080/geoserver/ows"
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 2
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - data:/data
      - tmp:/tmp
    restart: unless-stopped
    depends_on:
      data-dir-conf:
        condition: service_healthy
      django:
        condition: service_healthy

  data-dir-conf:
    image: geonode/geoserver_data:2.28.x-latest
    container_name: gsconf4${COMPOSE_PROJECT_NAME}
    entrypoint: sleep infinity
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    restart: unless-stopped
    healthcheck:
      test: "ls -A '/geoserver_data/data' | wc -l"

  # PostGIS database.
  db:
    # use geonode official postgis 15 image
    image: geonode/postgis:15-3.5-latest
    command: postgres -c "max_connections=${POSTGRESQL_MAX_CONNECTIONS}"
    container_name: db4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
      - dbbackups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: "pg_isready -d postgres -U postgres"
    # uncomment to enable remote connections to postgres
    #ports:
    #  - "5432:5432"

  # Vanilla Redis service. This is needed by celery
  redis:
    image: redis:7-alpine
    container_name: redis4${COMPOSE_PROJECT_NAME}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: "redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Logto - tự host Identity Provider (OIDC) cho đăng nhập chính của GITC Portal.
  # Cổng 3001: core API + màn hình đăng nhập; 3002: Admin Console.
  # Docs: https://docs.logto.io/logto-oss/
  logto:
    image: svhd/logto:${LOGTO_TAG:-latest}
    container_name: logto4${COMPOSE_PROJECT_NAME}
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - TRUST_PROXY_HEADER=1
      - ENDPOINT=http://localhost
      - ADMIN_ENDPOINT=http://localhost:3002
      - DB_URL=postgres://logto:${LOGTO_DB_PASSWORD:-logto}@logto-postgres:5432/logto
      - REDIS_URL=redis://redis:6379/1
      - COOKIE_PATH=/
      - PRIVATE_KEY_ROTATION_GRACE_PERIOD=1
    restart: unless-stopped
    depends_on:
      logto-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: "node -e \"fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      start_period: 60s
      interval: 30s
      timeout: 20s
      retries: 5

  # Database riêng cho Logto (không dùng chung PostGIS của GeoNode).
  logto-postgres:
    image: postgres:16-alpine
    container_name: logtodb4${COMPOSE_PROJECT_NAME}
    environment:
      - POSTGRES_DB=logto
      - POSTGRES_USER=logto
      - POSTGRES_PASSWORD=${LOGTO_DB_PASSWORD:-logto}
    volumes:
      - logto-dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: "pg_isready -U logto -d logto"
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  nginx-confd:
    name: ${COMPOSE_PROJECT_NAME}-nginxconfd
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME}-nginxcerts
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  dbdata:
    name: ${COMPOSE_PROJECT_NAME}-dbdata
  dbbackups:
    name: ${COMPOSE_PROJECT_NAME}-dbbackups
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
  tmp:
    name: ${COMPOSE_PROJECT_NAME}-tmp
  redisdata:
    name: ${COMPOSE_PROJECT_NAME}-redisdata
  logto-dbdata:
    name: ${COMPOSE_PROJECT_NAME}-logtodbdata
