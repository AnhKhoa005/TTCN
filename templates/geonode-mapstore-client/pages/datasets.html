{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layers - GeoNode WebGIS</title>
<link href="{% static 'geonode/css/base.css' %}" rel="stylesheet"/>
<link rel="stylesheet" href="{% static 'geonode/css/font-awesome.min.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: light;
    --navy: #1e3a5f; --navy-deep: #12294d;
    --blue: #2563eb; --blue-dark: #1d4ed8; --blue-soft: #dbeafe;
    --ink: #10233f; --slate: #54677e; --muted: #8ea0b5;
    --line: #e3e9f2; --bg: #f3f6fb;
  }
  body { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
  a { text-decoration: none; }
  .topbar { background: linear-gradient(180deg, #24466e, var(--navy)); color: #fff; padding: 18px 0; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 14px rgba(16,35,63,0.25); }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-weight: 800; font-size: 1.75rem; color: #fff; letter-spacing: -0.01em; }
  .brand i { color: #60a5fa; font-size: 1.9rem; }
  .brand span b { color: #60a5fa; }
  .nav { display: flex; gap: 10px; align-items: center; }
  .nav a { color: rgba(255,255,255,0.82); padding: 12px 22px; border-radius: 12px; font-size: 1.05rem; font-weight: 600; transition: all 0.15s; white-space: nowrap; border: 1px solid transparent; }
  .nav a i { font-size: 1.1rem; margin-right: 6px; }
  .nav a:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .nav a.active { background: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,0.45); }
  .nav .back { color: #bbd7ff; padding: 12px 14px; }
  .herobanner { background: linear-gradient(115deg, var(--navy-deep) 0%, var(--navy) 45%, #2f5da3 78%, var(--blue) 135%); color: #fff; padding: 50px 0 46px; position: relative; overflow: hidden; }
  .herobanner::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.13) 1px, transparent 1px); background-size: 22px 22px; pointer-events: none; }
  .herobanner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #60a5fa, #2563eb, #60a5fa); }
  .herobanner .container { position: relative; }
  .crumb { font-size: 0.8rem; color: rgba(255,255,255,0.65); margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; font-weight: 500; }
  .crumb a { color: #bbd7ff; }
  .crumb a:hover { color: #fff; }
  .crumb span { color: #fff; font-weight: 600; }
  .herobanner h1 { font-family: 'Be Vietnam Pro', 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 2.3rem; font-weight: 700; letter-spacing: -0.02em; }
  .herobanner p { color: rgba(255,255,255,0.82); margin-top: 8px; font-size: 1.02rem; max-width: 640px; }
  .toolbar { padding: 22px 0 4px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .searchbox { flex: 1; min-width: 220px; position: relative; }
  .searchbox input { width: 100%; padding: 12px 14px 12px 40px; border: 1px solid #c9d4e2; border-radius: 12px; font-size: 0.95rem; background: #fff; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s; }
  .searchbox input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .searchbox i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  select, .filter-btn { padding: 12px 14px; border: 1px solid #c9d4e2; border-radius: 12px; font-size: 0.9rem; font-family: inherit; font-weight: 500; color: var(--ink); background: #fff; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
  .countline { padding: 12px 0; color: var(--slate); font-size: 0.9rem; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding-bottom: 56px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(16,35,63,0.06); transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; display: flex; flex-direction: column; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 18px 36px rgba(30,58,95,0.16); border-color: #bcd0ee; }
  .thumb { height: 160px; background: linear-gradient(135deg, #dbeafe, #ecfdf5); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
  .card:hover .thumb img { transform: scale(1.05); }
  .thumb .ph { font-size: 3rem; color: #93c5fd; }
  .thumb .type { position: absolute; top: 10px; left: 10px; font-size: 0.7rem; padding: 4px 11px; border-radius: 20px; font-weight: 700; letter-spacing: 0.02em; box-shadow: 0 2px 8px rgba(16,35,63,0.15); }
  .type-vector { background: #dbeafe; color: #1d4ed8; }
  .type-raster { background: #d1fae5; color: #047857; }
  .card-body { padding: 16px 16px 12px; display: flex; flex-direction: column; flex: 1; }
  .card-body h3 { font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-size: 1.04rem; font-weight: 600; line-height: 1.42; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: color 0.15s; }
  .card:hover .card-body h3 { color: var(--blue); }
  .card-body .name { display: inline-block; align-self: flex-start; font-size: 0.72rem; font-family: 'Consolas', 'Menlo', monospace; background: #eef4ff; color: var(--blue-dark); padding: 3px 8px; border-radius: 6px; margin: 8px 0 4px; word-break: break-all; }
  .card-body .abs { font-size: 0.83rem; color: var(--slate); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 0.76rem; color: var(--muted); font-weight: 500; }
  .meta span { display: flex; align-items: center; gap: 5px; }
  .meta i { color: #7fa5d6; }
  .card-foot { border-top: 1px solid #eef2f7; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .btn-open { background: linear-gradient(180deg, #3b82f6, var(--blue)); color: #fff; padding: 8px 16px; border-radius: 9px; font-size: 0.83rem; font-weight: 600; box-shadow: 0 3px 10px rgba(37,99,235,0.35); transition: background 0.15s, box-shadow 0.15s; }
  .btn-open:hover { background: var(--blue-dark); box-shadow: 0 5px 14px rgba(37,99,235,0.45); }
  .foot { background: var(--navy); color: rgba(255,255,255,0.6); text-align: center; padding: 24px 0; font-size: 0.83rem; }
  .foot b { color: #fff; }
  .spinner { text-align: center; padding: 60px; color: var(--slate); }
  .empty { text-align: center; padding: 60px 20px; color: var(--slate); }
  .empty i { font-size: 3rem; color: #c3d2e5; display: block; margin-bottom: 12px; }
  @media(max-width:640px){ .nav a span { display:none; } .herobanner h1{font-size:1.5rem;} }
</style>
</head>
<body>
<div class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/"><i class="fa fa-globe"></i> Geo<span><b>Node</b></span></a>
    <nav class="nav">
      <a class="back" href="/"><i class="fa fa-home"></i></a>
      <a href="/datasets" class="active"><i class="fa fa-database"></i> <span>Layers</span></a>
      <a href="/maps"><i class="fa fa-map"></i> <span>Bản đồ</span></a>
      <a href="/documents"><i class="fa fa-file-text-o"></i> <span>Tài liệu</span></a>
    </nav>
  </div>
</div>

<div class="herobanner">
  <div class="container">
    <div class="crumb"><a href="/">Trang chủ</a> / <span>Layers</span></div>
    <h1>Khám phá Layers</h1>
    <p>Danh sách các lớp dữ liệu không gian trên nền tảng GeoNode.</p>
  </div>
</div>

<div class="container">
  <div class="toolbar">
    <div class="searchbox">
      <i class="fa fa-search"></i>
      <input id="q" type="text" placeholder="Tìm kiếm layer...">
    </div>
    <select id="typeFilter">
      <option value="">Tất cả loại</option>
      <option value="vector">Vector</option>
      <option value="raster">Raster</option>
    </select>
    <select id="sortSel">
      <option value="newest">Mới nhất</option>
      <option value="title">Tên A-Z</option>
      <option value="popular">Phổ biến</option>
    </select>
  </div>
  <div class="countline" id="countline"></div>
  <div id="grid" class="grid"><div class="spinner" style="grid-column:1/-1"><i class="fa fa-spinner fa-spin" style="font-size:2rem"></i><br>Đang tải dữ liệu...</div></div>
</div>

<div class="foot">© <span id="yr"></span> GeoNode <b>WebGIS</b> - Đồ án Phát triển ứng dụng Web GIS</div>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  let all = [];
  const qEl = document.getElementById('q');
  const typeEl = document.getElementById('typeFilter');
  const sortEl = document.getElementById('sortSel');
  const grid = document.getElementById('grid');
  const countline = document.getElementById('countline');

  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function render(){
    let list = all.slice();
    const q = qEl.value.trim().toLowerCase();
    if(q){ list = list.filter(l => (l.title||'').toLowerCase().includes(q) || (l.alternate||'').toLowerCase().includes(q)); }
    const t = typeEl.value;
    if(t){ list = list.filter(l => l.type === t); }
    const s = sortEl.value;
    if(s==='title'){ list.sort((a,b)=>(a.title||'').localeCompare(b.title)); }
    else if(s==='popular'){ list.sort((a,b)=>(b.popular_count||0)-(a.popular_count||0)); }
    else { list.sort((a,b)=>(b.last_updated||b.created||'').localeCompare(a.last_updated||a.created||'')); }
    countline.textContent = 'Hiển thị ' + list.length + ' layer';
    if(!list.length){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="fa fa-database"></i>Không tìm thấy layer nào</div>';
      return;
    }
    grid.innerHTML = list.map(function(l){
      const isRaster = (l.type==='raster');
      const thumb = l.thumbnail_url ? '<img src="'+esc(l.thumbnail_url)+'" alt="">' : '<div class="ph"><i class="fa fa-'+(isRaster?'image':'map')+'"></i></div>';
      const owner = (l.owner && l.owner.username) ? l.owner.username : 'unknown';
      const detail = '/catalogue/#/dataset/' + (l.pk || l.id || '');
      return '<div class="card">'+
        '<div class="thumb">'+thumb+'<span class="type '+(isRaster?'type-raster':'type-vector')+'">'+(isRaster?'Raster':'Vector')+'</span></div>'+
        '<div class="card-body"><h3>'+esc(l.title)+'</h3>'+
        '<div class="name">'+esc(l.alternate||l.name)+'</div>'+
        '<div class="abs">'+esc(l.raw_abstract && l.raw_abstract!=='No abstract provided'?l.raw_abstract:l.abstract||'Chưa có mô tả.')+'</div>'+
        '<div class="meta"><span><i class="fa fa-user"></i>'+esc(owner)+'</span>'+
        '<span><i class="fa fa-calendar"></i>'+esc((l.date||l.created||'').slice(0,10))+'</span>'+
        '<span><i class="fa fa-download"></i>'+(l.popular_count||0)+'</span></div></div>'+
        '<div class="card-foot"><span style="font-size:.72rem;color:#94a3b8">'+esc(l.srid||'EPSG:4326')+'</span>'+
        '<a class="btn-open" href="'+detail+'">Mở layer <i class="fa fa-arrow-right"></i></a></div>'+
      '</div>';
    }).join('');
  }

  qEl.addEventListener('input', render);
  typeEl.addEventListener('change', render);
  sortEl.addEventListener('change', render);

  fetch('/api/v2/datasets/?page_size=100')
    .then(r=>r.json())
    .then(function(d){
      all = (d.datasets||[]).map(function(x){
        let type='vector';
        if(x.sourcetype==='coverage'||x.sourcetype==='remote'){ type='raster'; }
        return Object.assign({}, x, { type: type });
      });
      render();
    })
    .catch(function(){ grid.innerHTML='<div class="empty" style="grid-column:1/-1"><i class="fa fa-exclamation-triangle"></i>Không thể tải dữ liệu. Vui lòng thử lại.</div>'; });
</script>
</body>
</html>
